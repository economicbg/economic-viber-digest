yaml
name: Viber API Test

on:
  workflow_dispatch:

jobs:
  test-viber:
    runs-on: ubuntu-latest

    steps:
      - name: Send test message to Viber
        env:
          VIBER_AUTH_TOKEN: ${{ secrets.VIBER_AUTH_TOKEN }}
          VIBER_FROM_ID: ${{ secrets.VIBER_FROM_ID }}
        run: |
          curl -sS \
            -X POST \
            -H "Content-Type: application/json" \
            -d "{\"auth_token\":\"$VIBER_AUTH_TOKEN\",\"from\":\"$VIBER_FROM_ID\",\"type\":\"text\",\"text\":\"🧪 Тестова публикация от ⁨economic.bg⁩\"}" \
            ⁨https://chatapi.viber.com/pa/post⁩
