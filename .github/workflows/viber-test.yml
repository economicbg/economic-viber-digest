yaml name: Viber API Test  on:   workflow_dispatch:  jobs:   test:     runs-on: ubuntu-latest      steps:       - name: Test Viber         env:           TOKEN: ${{ secrets.VIBER_AUTH_TOKEN }}           FROM_ID: ${{ secrets.VIBER_FROM_ID }}         run: |           python3 -c 'import os,json,urllib.request; d={"auth_token":os.environ["TOKEN"],"from":os.environ["FROM_ID"],"type":"text","text":"TEST - ⁨economic.bg⁩ Viber API"}; r=urllib.request.Request("⁨https://chatapi.viber.com/pa/post⁩",data=json.dumps(d).encode(),headers={"Content-Type":"application/json"}); print(urllib.request.urlopen(r).read().decode())'
